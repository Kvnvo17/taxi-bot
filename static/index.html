<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taksi Raqami</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app">
        <!-- HEADER -->
        <div id="header">
            <h1>🚖 Taksi Raqami</h1>
            <span id="theme-toggle">🌓</span>
        </div>

        <!-- MAIN CONTENT -->
        <div id="main">
            <!-- BOSH SAHIFA -->
            <div id="page-home" class="page active">
                <div class="card-grid">
                    <div class="card" data-action="driver"><span class="icon">🚖</span><span class="label">Men taksisman</span></div>
                    <div class="card" data-action="passenger"><span class="icon">🧍</span><span class="label">Men yo‘lovchiman</span></div>
                    <div class="card" data-action="parcel_receive"><span class="icon">📦</span><span class="label">Pochta olaman</span></div>
                    <div class="card" data-action="parcel_send"><span class="icon">📦</span><span class="label">Pochta yuboraman</span></div>
                </div>
            </div>

            <!-- E'LONLAR -->
            <div id="page-ads" class="page">
                <h2>📋 E’lonlar</h2>
                <div style="display:flex; gap:8px; margin-bottom:12px;">
                    <button class="tab-btn active" data-tab="taxi">🚖 Taksi</button>
                    <button class="tab-btn" data-tab="parcel">📦 Pochta</button>
                </div>
                <div id="ads-list"></div>
            </div>

            <!-- BUYURTMALAR -->
            <div id="page-orders" class="page">
                <h2>📦 Buyurtmalar</h2>
                <div style="display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;">
                    <button class="filter-btn active" data-status="all">📋 Barchasi</button>
                    <button class="filter-btn" data-status="waiting">🟡 Kutilmoqda</button>
                    <button class="filter-btn" data-status="completed">✅ Yakunlangan</button>
                    <button class="filter-btn" data-status="cancelled">❌ Bekor qilingan</button>
                </div>
                <div id="orders-list"></div>
            </div>

            <!-- PROFIL -->
            <div id="page-profile" class="page">
                <h2>👤 Profil</h2>
                <div id="profile-content"></div>
            </div>

            <!-- FORMA SAHIFASI -->
            <div id="page-form" class="page">
                <h2 id="form-title">Forma</h2>
                <div id="form-body"></div>
                <button id="form-back" class="back-btn">🔙 Orqaga</button>
            </div>

            <!-- ADMIN PANEL (faqat admin ko‘radi) -->
            <div id="page-admin" class="page">
                <h2>👑 Admin Panel</h2>
                <div id="admin-content">
                    <div class="admin-stats">
                        <div class="stat-card">👤 Foydalanuvchilar: <span id="stat-users">0</span></div>
                        <div class="stat-card">🚖 Taksi e’lonlari: <span id="stat-taxi">0</span></div>
                        <div class="stat-card">📦 Buyurtmalar: <span id="stat-orders">0</span></div>
                    </div>
                    <button onclick="loadAdminUsers()">👤 Foydalanuvchilar</button>
                    <button onclick="loadAdminComplaints()">📢 Shikoyatlar</button>
                    <button onclick="sendBroadcast()">📣 Reklama yuborish</button>
                    <div id="admin-data"></div>
                </div>
                <button id="admin-back" class="back-btn">🔙 Orqaga</button>
            </div>
        </div>

        <!-- BOTTOM NAV -->
        <div id="bottom-nav">
            <button class="nav-btn active" data-page="home">🏠 Bosh</button>
            <button class="nav-btn" data-page="ads">📋 E’lonlar</button>
            <button class="nav-btn" data-page="orders">📦 Buyurtmalar</button>
            <button class="nav-btn" data-page="profile">👤 Profil</button>
            <!-- Admin tugmasi dinamik qo‘shiladi -->
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
