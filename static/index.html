<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taksi Raqami</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/static/regions.js"></script>
</head>
<body>
    <div id="app">
        <!-- HEADER -->
        <div id="header">
            <h1>🚖 Taksi Raqami</h1>
            <div>
                <span id="theme-toggle">🌓</span>
                <a href="/admin" target="_blank" style="margin-left:12px;font-size:14px;color:#4f46e5;">👑 Admin</a>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div id="main">
            <!-- ========== BOSH SAHIFA ========== -->
            <div id="page-home" class="page active">
                <div class="card-grid">
                    <div class="card" data-action="driver">
                        <span class="icon">🚖</span>
                        <span class="label">Men taksisman</span>
                    </div>
                    <div class="card" data-action="passenger">
                        <span class="icon">🧍</span>
                        <span class="label">Men yo‘lovchiman</span>
                    </div>
                    <div class="card" data-action="parcel_send">
                        <span class="icon">📦</span>
                        <span class="label">Pochta yuboraman</span>
                    </div>
                </div>
                <!-- ========== BANNER ========== -->
                <div id="home-banner" style="margin-top:20px; text-align:center;">
                    <img id="banner-image" src="" alt="Reklama" style="width:100%; max-width:400px; border-radius:16px; display:none;">
                </div>
            </div>

            <!-- ========== E'LONLAR ========== -->
            <div id="page-ads" class="page">
                <h2>📋 E’lonlar</h2>
                <div class="tab-bar">
                    <button class="tab-btn active" data-tab="taxi">🚖 Taksi</button>
                    <button class="tab-btn" data-tab="parcel">📦 Pochta</button>
                </div>
                <div id="ads-list"></div>
            </div>

            <!-- ========== BUYURTMALAR ========== -->
            <div id="page-orders" class="page">
                <h2>📦 Buyurtmalar</h2>
                <div class="filter-bar">
                    <button class="filter-btn active" data-status="all">📋 Barchasi</button>
                    <button class="filter-btn" data-status="waiting">🟡 Kutilmoqda</button>
                    <button class="filter-btn" data-status="completed">✅ Yakunlangan</button>
                    <button class="filter-btn" data-status="cancelled">❌ Bekor qilingan</button>
                </div>
                <div id="orders-list"></div>
            </div>

            <!-- ========== PROFIL ========== -->
            <div id="page-profile" class="page">
                <h2>👤 Profil</h2>
                <div id="profile-content"></div>
            </div>

            <!-- ========== FORMA ========== -->
            <div id="page-form" class="page">
                <h2 id="form-title">Forma</h2>
                <div id="form-body"></div>
                <button id="form-back" class="back-btn">🔙 Orqaga</button>
            </div>

            <!-- ========== BUYURTMA NATIJASI ========== -->
            <div id="page-order-result" class="page">
                <div id="order-result-content"></div>
                <button id="order-result-back" class="back-btn">🔙 Orqaga</button>
            </div>
        </div>

        <!-- BOTTOM NAV -->
        <div id="bottom-nav">
            <button class="nav-btn active" data-page="home">🏠 Bosh</button>
            <button class="nav-btn" data-page="ads">📋 E’lonlar</button>
            <button class="nav-btn" data-page="orders">📦 Buyurtmalar</button>
            <button class="nav-btn" data-page="profile">👤 Profil</button>
        </div>
    </div>

    <!-- MODAL -->
    <div id="modal-overlay" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
